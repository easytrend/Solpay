      display:"flex",flexDirection:"column",gap:6
    }}>
      <div style={{display:"flex",alignItems:"flex-start",gap:8}}>
        <span style={{fontSize:16,flexShrink:0}}>{type==="error"?"❌":"✅"}</span>
        <span style={{fontSize:13,lineHeight:1.4,flex:1}}>{message}</span>
        <button onClick={onClose} style={{background:"none",border:"none",color:"rgba(255,255,255,0.4)",cursor:"pointer",fontSize:14,padding:0,flexShrink:0}}>✕</button>
      </div>
      {link&&(
        <a href={link} target="_blank" rel="noopener noreferrer"
          style={{fontSize:11,color:"var(--lime)",textDecoration:"none",fontWeight:600,marginLeft:24}}>
          {linkLabel||"View transaction"} ↗
        </a>
      )}
    </div>
  );
}

// ── Main App ──
function App() {

  const [bulkMode,setBulkMode]=React.useState(false);
  const [connected,setConnected]=React.useState(false);
  const [walletPubkey,setWalletPubkey]=React.useState(null);
  const [showWalletSelect,setShowWalletSelect]=React.useState(false);
  const [solBalance,setSolBalance]=React.useState(null);
  const [splTokens,setSplTokens]=React.useState([]);
  const [walletLoading,setWalletLoading]=React.useState(false);
  const [walletError,setWalletError]=React.useState(null);
  const [recipient,setRecipient]=React.useState("");
  const [amount,setAmount]=React.useState("");
  const [currency,setCurrency]=React.useState("USD");
  const [inputMode,setInputMode]=React.useState("fiat");
  const [token,setToken]=React.useState("USDC");
  const [showModal,setShowModal]=React.useState(false);
  const [tokenQ,setTokenQ]=React.useState("");
  const [sendingFee,setSendingFee]=React.useState(false);
  const [toast,setToast]=React.useState(null);
  const [bulkProgress,setBulkProgress]=React.useState(null); // {rowId: {status,txId,err}}

  const [liveRates,setLiveRates]=React.useState({fiat:{},crypto:{},updatedAt:null});
  const [ratesLoading,setRatesLoading]=React.useState(true);

  // Fetch live rates on mount, refresh every 60s
  React.useEffect(()=>{
    async function load(){
      setRatesLoading(true);
      const r=await fetchLiveRates();
      setLiveRates(r);
      setRatesLoading(false);
    }
    load();
    const id=setInterval(load,30000); // refresh every 30s to match cache TTL
    return()=>clearInterval(id);
  },[]);

  // Auto-select first held token as soon as any tokens become available.
  // Fires on splTokens (fast-pass) and solBalance changes, not on filteredTokens,
  // to avoid the stale-closure race where filteredTokens hasn't re-run yet.
  React.useEffect(()=>{
    if(!connected) return;
    // Build the same candidate list inline to avoid stale memo
    const candidates = [];
    if(solBalance !== null) candidates.push({symbol:"SOL"});
    splTokens.forEach(t=>{ if(t.balance>0) candidates.push(t); });
    if(candidates.length===0) return;
    const currentInWallet = candidates.find(
      t=>(t.symbol||"").toUpperCase()===token.toUpperCase()
    );
    if(!currentInWallet) {
      setToken(candidates[0].symbol);
    }
  // eslint-disable-next-line react-hooks/exhaustive-deps
  },[connected, splTokens, solBalance]);
  function getLiveCurrRate(code){
    const staticC=CURRENCIES.find(c=>c.code===code)||CURRENCIES[0];
    return liveRates.fiat[code]||staticC.rate;
  }
  // Resolve live token price (fall back to static)
  function getLiveTokPrice(symbol){
    const staticT=TOKENS.find(t=>t.symbol===symbol);
    return liveRates.crypto[symbol]||staticT?.price||0;
  }

  function findTokenMeta(symbol){
    if(!symbol) return null;
    return TOKENS.find(t=>(t.symbol||"").toUpperCase()===String(symbol).toUpperCase())||null;
  }

  // Build token list as soon as wallet is connected — don't wait for RPC balance
  const liveSolPrice = liveRates.crypto["SOL"]||148.5;
  const walletTokenList = React.useMemo(()=>{
    if(!connected) return null;
    const solEntry={
      symbol:"SOL", name:"Solana", color:"#9945FF", bg:"#2d1a4e",
      price: liveRates.crypto["SOL"]||148.5,
      balance: solBalance, // null while loading
      logo:"https://raw.githubusercontent.com/solana-labs/token-list/main/assets/mainnet/So11111111111111111111111111111111111111112/logo.png"
    };
    const splEntries=splTokens.map(t=>{
      const meta=findTokenMeta(t.symbol)||{color:"#aaa",bg:"rgba(255,255,255,0.08)"};
      const livePrice=liveRates.crypto[t.symbol]||t.price||meta.price||0;
      return{...meta,...t,price:livePrice};
    });
    return[solEntry,...splEntries];
  },[connected,solBalance,splTokens,liveRates]);

  // Token list: only show held tokens when connected, alphabetically sorted.
  // Depends on splTokens directly (not just walletTokenList) so it re-runs
  // as soon as the fast-pass setSplTokens fires.
  const filteredTokens = React.useMemo(()=>{
    if(!connected) return [];

    const q = tokenQ.toLowerCase().trim();

    // Build the candidate list from walletTokenList (which includes SOL + SPL)
    const candidates = walletTokenList || [];

    // Only include tokens with a real balance
    const heldTokens = candidates.filter(t => {
      if(t.symbol === "SOL") return solBalance !== null && solBalance >= 0;
      return typeof t.balance === "number" && t.balance > 0;
    });

    const filtered = q
      ? heldTokens.filter(t=>
          (t.symbol||"").toLowerCase().includes(q) ||
          (t.name||"").toLowerCase().includes(q) ||
          (t.mint||"").toLowerCase().includes(q)
        )
      : heldTokens;

    return [...filtered].sort((a,b)=>(a.symbol||"").localeCompare(b.symbol||""));
  // splTokens is listed explicitly so the memo re-runs on the fast-pass update
  },[connected, walletTokenList, solBalance, splTokens, tokenQ]);

  // Find selected token — only from wallet list when connected
  const tok = connected && walletTokenList
    ? (walletTokenList.find(t=>(t.symbol||"").toUpperCase()===token.toUpperCase()) || walletTokenList[0])
    : null;

  const curr=CURRENCIES.find(c=>c.code===currency)||CURRENCIES[0];
  // Override with live rates
  const currRate = getLiveCurrRate(currency);
  const tokPrice = tok ? (tok.price||getLiveTokPrice(tok.symbol)||0) : 0;
  const num=parseFloat(amount)||0;
  const tokAmt=tok ? (inputMode==="fiat"?(num/currRate)/tokPrice:num) : 0;
  const fiatAmt=tok ? (inputMode==="crypto"?num*tokPrice*currRate:num) : 0;
  const dispTok=fmtTok(tokAmt);
  // Patch curr and tok with live values for child components
  const currLive={...curr,rate:currRate};
  const tokLive=tok ? {...tok,price:tokPrice} : null;



  async function fetchBalances(pubkey){
    setWalletLoading(true);setWalletError(null);
    try{
      // ── Step 1: SOL balance — fast, unblocks the token selector immediately ──
      // Retry once on failure before surfacing an error to the user
      let balRes;
      try{
        balRes = await rpcFetch("getBalance",[pubkey,{commitment:"confirmed"}]);
      }catch(firstErr){
        console.warn("SOL balance first attempt failed, retrying…", firstErr.message);
        // Brief pause then retry — handles transient RPC hiccups
        await new Promise(r=>setTimeout(r,1500));
        balRes = await rpcFetch("getBalance",[pubkey,{commitment:"confirmed"}]);
      }
      const solBal = balRes.value/1e9;
      setSolBalance(solBal);
      // walletLoading stays true — spinner shows while SPL tokens load

      // ── Step 2: SPL token accounts — both programs in parallel ──
      const tokenQueries = await Promise.allSettled([
        rpcFetch("getTokenAccountsByOwner",[
          pubkey,
          {programId:TOKEN_PROGRAM},
          {encoding:"jsonParsed",commitment:"confirmed"}
        ]),
        rpcFetch("getTokenAccountsByOwner",[
          pubkey,
          {programId:TOKEN_2022_PROGRAM},
          {encoding:"jsonParsed",commitment:"confirmed"}
        ])
      ]);
      const tokenAccounts = tokenQueries
        .filter(x=>x.status==="fulfilled")
        .flatMap(x=>(x.value&&x.value.value)||[]);

      // ── Step 3: Parse token accounts into byMint map ──
      const byMint = {};
      tokenAccounts.forEach(a=>{
        try{
          const info=a?.account?.data?.parsed?.info;
          if(!info||!info.mint) return;
          const mint=info.mint;
          const tokenAmount=info.tokenAmount;
          if(!tokenAmount) return;

          const uiAmount=readUiTokenAmount(tokenAmount);
          const decimals = Number(tokenAmount.decimals??0);
          const rawAmount = Number(tokenAmount.amount||0);

          const meta=KNOWN_MINTS[mint]||{};
          const fallbackSym=("TKN-"+mint.slice(0,4)).toUpperCase();

          if(!byMint[mint]){
            byMint[mint]={
              mint,
              uiAmount:0,
              balance:0,
              rawAmount:0,
              decimals,
              symbol:meta.symbol||fallbackSym,
              name:meta.name||("Token "+mint.slice(0,8)+"…"),
              price:meta.price||0,
              logo:meta.logo||null,
              isNFT: decimals===0 && rawAmount===1,
            };
          }
          byMint[mint].uiAmount  += uiAmount;
          byMint[mint].rawAmount += rawAmount;
          byMint[mint].balance    = byMint[mint].uiAmount;
          byMint[mint].isNFT = byMint[mint].decimals===0 && byMint[mint].rawAmount===1;
        }catch(rowErr){
          console.warn("Token account parse error:", rowErr.message);
        }
      });

      const raw = Object.values(byMint).filter(t=>t.uiAmount>0||t.rawAmount>0);

      // ── Step 4: Emit a FAST first pass using only KNOWN_MINTS data ──
      // This makes tokens appear immediately without waiting for Jupiter/Metaplex.
      const fastToks = raw.map(t=>{
        const known = KNOWN_MINTS[t.mint]||{};
        return {
          ...t,
          price:  known.price||0,
          logo:   known.logo||null,
          symbol: known.symbol||t.symbol,
          name:   known.name||t.name,
          tokenType: t.isNFT?"nft":t.decimals===0?"fungible-no-dec":"unknown",
        };
      }).sort((a,b)=>{
        const aVal=a.uiAmount*(a.price||0), bVal=b.uiAmount*(b.price||0);
        if(bVal!==aVal) return bVal-aVal;
        return (a.symbol||"").localeCompare(b.symbol||"");
      });
      // Publish fast pass — token selector becomes usable immediately
      setSplTokens(fastToks);
      setWalletLoading(false); // ← unblock UI now; metadata enrichment continues below

      // ── Step 5: Enrich with Jupiter prices + metadata (background, non-blocking) ──
      const [mintPrices, mintMeta] = await Promise.all([
        fetchJupiterPricesByMint(raw.map(t=>t.mint)),
        fetchJupiterTokenMeta(raw.map(t=>t.mint))
      ]);

      const enrichedToks = raw.map(t=>{
        const meta    = mintMeta[t.mint]||{};
        const known   = KNOWN_MINTS[t.mint]||{};
        const price   = mintPrices[t.mint]||known.price||0;
        const logo    = known.logo||meta.logo||null;
        const symbol  = known.symbol||meta.symbol||t.symbol;
        const name    = known.name||meta.name||t.name;
        const decimals= known.decimals??meta.decimals??t.decimals??6;

        // Recompute uiAmount with correct decimals from metadata
        let uiAmount = t.uiAmount;
        if(decimals!==t.decimals && t.rawAmount>0){
          uiAmount = t.rawAmount / Math.pow(10, decimals);
        }

        return {
          ...t,
          uiAmount,
          balance: uiAmount,
          price,
          logo,
          symbol,
          name,
          decimals,
          tokenType: t.isNFT ? "nft"
            : decimals===0 ? "fungible-no-dec"
            : price===0    ? "unknown"
            : "fungible",
        };
      }).sort((a,b)=>{
        const aVal=a.uiAmount*(a.price||0), bVal=b.uiAmount*(b.price||0);
        if(bVal!==aVal) return bVal-aVal;
        return (a.symbol||"").localeCompare(b.symbol||"");
      });

      // Publish enriched pass — prices and logos update silently
      setSplTokens(enrichedToks);

    }catch(e){
      setWalletError(e.message||"RPC error — check your connection and try again");
      console.error("fetchBalances error:", e);
      setWalletLoading(false);
    }
    // Note: setWalletLoading(false) is called after fast pass above,
    // so we only need it here in the catch path.
  }

  // Track the active provider reference so send functions use the right one
  const activeProviderRef = React.useRef(null);

  async function handleWalletSelect(provider, walletId){
    setShowWalletSelect(false);
    if(!provider){
      setToast({msg:"No Solana wallet found. Install Phantom or Solflare then reload.", type:"error"});
      return;
    }
    try{
      const resp = await provider.connect();

      // Normalise public key — Solflare returns publicKey directly on the provider
      // after connect(), while Phantom returns it on the response object.
      let pk;
      if(resp?.publicKey){
        pk = typeof resp.publicKey.toString === "function"
          ? resp.publicKey.toString()
          : String(resp.publicKey);
      } else if(provider.publicKey){
        pk = typeof provider.publicKey.toString === "function"
          ? provider.publicKey.toString()
          : String(provider.publicKey);
      } else {
        throw new Error("Could not read public key from wallet response");
      }

      if(!pk || pk.length < 32) throw new Error("Invalid public key returned by wallet");

      activeProviderRef.current = provider;
      setWalletPubkey(pk);
      setConnected(true);
      try{ localStorage.setItem(WALLET_STORAGE_KEY, walletId||"phantom"); }catch(_){}
      fetchBalances(pk);
    }catch(e){
      const msg = e?.message||"";
      if(msg.includes("User rejected")||msg.includes("rejected")||
         msg.includes("cancelled")||msg.includes("canceled")||e?.code===4001){
        setToast({msg:"Connection cancelled.", type:"error"});
      } else {
        setToast({msg:"Wallet connection failed: "+(msg||"Unknown error"), type:"error"});
      }
      console.error("Wallet connect error:", e);
    }
  }

  function disconnectWallet(){
    setConnected(false);setWalletPubkey(null);setSolBalance(null);setSplTokens([]);setWalletError(null);
    setToken("USDC");
    activeProviderRef.current = null;
    try{ localStorage.removeItem(WALLET_STORAGE_KEY); }catch(_){}
    try{
      const p = window.phantom?.solana||window.solana||window.solflare;
      if(p&&typeof p.disconnect==="function") p.disconnect();
    }catch(e){}
  }

  // Helper: get the active provider for signing
  function getProvider(){
    if(activeProviderRef.current) return activeProviderRef.current;
    // Fallback scan
    const wallets = detectWallets();
    return wallets[0]?.provider || window.phantom?.solana || window.solana || window.solflare || null;
  }

  async function connectWallet(){
    setShowWalletSelect(true);
  }

  // Auto-reconnect on mount if a wallet was previously connected
  React.useEffect(()=>{
    async function tryAutoReconnect(){
      try{
        const lastWallet = localStorage.getItem(WALLET_STORAGE_KEY);
        if(!lastWallet) return;
        const wallets = detectWallets();
        const w = wallets.find(x=>x.id===lastWallet) || wallets[0];
        if(!w) return;
        const resp = await w.provider.connect({ onlyIfTrusted: true });
        let pk;
        if(resp?.publicKey){
          pk = typeof resp.publicKey.toString==="function" ? resp.publicKey.toString() : String(resp.publicKey);
        } else if(w.provider.publicKey){
          pk = typeof w.provider.publicKey.toString==="function" ? w.provider.publicKey.toString() : String(w.provider.publicKey);
        }
        if(!pk) throw new Error("No public key");
        activeProviderRef.current = w.provider;
        setWalletPubkey(pk); setConnected(true);
        fetchBalances(pk);
      }catch(e){
        try{ localStorage.removeItem(WALLET_STORAGE_KEY); }catch(_){}
      }
    }
    tryAutoReconnect();
  // eslint-disable-next-line react-hooks/exhaustive-deps
  },[]);

  async function chargePlatformFeeInSol(totalFeeSol, reason){
    const feeLamports = lamportsToBigInt(totalFeeSol);
    if(feeLamports <= BigInt(0)) throw new Error("Invalid fee amount.");
    const provider = getProvider();
    if(!provider) throw new Error("Wallet provider not found.");
    const fromPubkey = provider.publicKey || (walletPubkey?new window.solanaWeb3.PublicKey(walletPubkey):null);
    if(!fromPubkey) throw new Error("Connect wallet first.");
    const feePubkey = new window.solanaWeb3.PublicKey(FEE_WALLET);
    const tx = new window.solanaWeb3.Transaction().add(
      window.solanaWeb3.SystemProgram.transfer({
        fromPubkey,
        toPubkey: feePubkey,
        lamports: feeLamports,
      })
    );
    const sig = await provider.signAndSendTransaction(tx);
    const txId = sig?.signature || sig;
    if(!txId) throw new Error("Fee transaction was not confirmed by wallet.");
    console.log("✅ Platform fee paid:", reason, txId, "lamports:", feeLamports.toString());
    return txId;
  }

  async function handleSingleSendFee(){
    if(!connected||!walletPubkey) return;
    if(!recipient||!(parseFloat(amount)>0)) return;
    try{
      setSendingFee(true);
      const provider=getProvider();
      if(!provider) throw new Error("Wallet provider not found. Please reconnect.");

      // ── 1. Resolve recipient ──────────────────────────────────────────────
      let recipientAddress = recipient.trim();
      if(!isValidSolanaAddress(recipientAddress)){
        // Treat as .sol domain (with or without the suffix)
        recipientAddress = await resolveSNSDomain(recipientAddress);
      }

      const fromPubkey = provider.publicKey;
      const toPubkey   = new window.solanaWeb3.PublicKey(recipientAddress);
      const feePubkey  = new window.solanaWeb3.PublicKey(FEE_WALLET);

      // ── 2. Validate token selection ───────────────────────────────────────
      if(!tokLive) throw new Error("No token selected. Please select a token first.");

      const tokenAmount = tokAmt;
      if(!(tokenAmount > 0)) throw new Error("Amount must be greater than zero.");

      const feeSol     = computeFeeSolFromTokenAmount(tokenAmount, tokLive.price, liveSolPrice);
      let   tx         = new window.solanaWeb3.Transaction();

      // ── 3. Build transfer instruction ─────────────────────────────────────
      if(tokLive.symbol === "SOL"){
        // SOL transfer — use BigInt lamports to avoid borsh u64 encoding error
        const lamports = lamportsToBigInt(tokenAmount);
        if(lamports <= BigInt(0)) throw new Error("Amount too small (minimum ~0.000000001 SOL).");
        tx.add(window.solanaWeb3.SystemProgram.transfer({
          fromPubkey,
          toPubkey,
          lamports,   // BigInt — required by web3.js v1.95 borsh encoder
        }));

      } else {
        // SPL Token transfer
        const mintAddress = tokLive.mint;
        if(!mintAddress) {
          throw new Error(
            `Cannot send ${tokLive.symbol}: mint address is missing. ` +
            `This token may not have loaded fully — try refreshing your wallet.`
          );
        }

        // Use the decimals from the token metadata (critical for correct amounts)
        // Fallback chain: tokLive.decimals → KNOWN_MINTS → 6 (USDC/USDT default)
        const knownMintMeta = KNOWN_MINTS[mintAddress];
        const decimals = (
          typeof tokLive.decimals === "number" ? tokLive.decimals :
          typeof knownMintMeta?.decimals === "number" ? knownMintMeta.decimals :
          6
        );

        const rawAmount = Math.floor(tokenAmount * Math.pow(10, decimals));
        if(rawAmount <= 0) throw new Error("Amount too small for this token's decimal precision.");

        const TOKEN_PROGRAM_ID          = new window.solanaWeb3.PublicKey("TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA");
        const ASSOCIATED_TOKEN_PROGRAM_ID = new window.solanaWeb3.PublicKey("ATokenGPvbdGVxr1b2hvZbsiqW5xWH25efTNsLJe1bRS");
        const mintPubkey                = new window.solanaWeb3.PublicKey(mintAddress);

        // Derive associated token accounts
        const [fromATA] = await window.solanaWeb3.PublicKey.findProgramAddress(
          [fromPubkey.toBytes(), TOKEN_PROGRAM_ID.toBytes(), mintPubkey.toBytes()],
          ASSOCIATED_TOKEN_PROGRAM_ID
        );
        const [toATA] = await window.solanaWeb3.PublicKey.findProgramAddress(
          [toPubkey.toBytes(), TOKEN_PROGRAM_ID.toBytes(), mintPubkey.toBytes()],
          ASSOCIATED_TOKEN_PROGRAM_ID
        );

        // Create recipient ATA if it doesn't exist yet
        const ataInfo = await rpcFetch("getAccountInfo", [toATA.toBase58(), {encoding:"base64"}]);
        if(!ataInfo?.value){
          tx.add({
            keys:[
              {pubkey:fromPubkey,  isSigner:true,  isWritable:true},
              {pubkey:toATA,       isSigner:false, isWritable:true},
              {pubkey:toPubkey,    isSigner:false, isWritable:false},
              {pubkey:mintPubkey,  isSigner:false, isWritable:false},
              {pubkey:new window.solanaWeb3.PublicKey("11111111111111111111111111111111"), isSigner:false, isWritable:false},
              {pubkey:TOKEN_PROGRAM_ID, isSigner:false, isWritable:false},
              {pubkey:new window.solanaWeb3.PublicKey("SysvarRent111111111111111111111111111111111"), isSigner:false, isWritable:false},
            ],
            programId: ASSOCIATED_TOKEN_PROGRAM_ID,
            data: new Uint8Array(0),
          });
        }

        // SPL Token Transfer instruction (discriminator = 3)
        // Layout: [u8 discriminator(1)] [u64 amount LE(8)] = 9 bytes total
        const ixData = new Uint8Array(9);
        ixData[0] = 3; // Transfer
        ixData.set(encodeU64LE(rawAmount), 1);

        tx.add({
          keys:[
            {pubkey:fromATA,    isSigner:false, isWritable:true},
            {pubkey:toATA,      isSigner:false, isWritable:true},
            {pubkey:fromPubkey, isSigner:true,  isWritable:false},
          ],
          programId: TOKEN_PROGRAM_ID,
          data: ixData,
        });
      }

      // ── 4. Platform fee (SOL) ─────────────────────────────────────────────
      const feeLamports = lamportsToBigInt(feeSol);
      if(feeLamports > BigInt(0)){
        tx.add(window.solanaWeb3.SystemProgram.transfer({
          fromPubkey,
          toPubkey: feePubkey,
          lamports: feeLamports,
        }));
      }

      // ── 5. Blockhash + sign + send ────────────────────────────────────────
      const bhResult = await rpcFetch("getLatestBlockhash", [{commitment:"confirmed"}]);
      tx.recentBlockhash = bhResult.value.blockhash;
      tx.feePayer        = fromPubkey;

      const sig   = await provider.signAndSendTransaction(tx);
      const txId  = sig?.signature || sig;
      if(!txId) throw new Error("Transaction was not confirmed by wallet.");

      const shortRecip = recipient.length > 20
        ? recipient.slice(0,8) + "…" + recipient.slice(-6)
        : recipient;
      setToast({
        msg: `✅ Sent ${fmtTok(tokenAmount)} ${tokLive.symbol} to ${shortRecip}`,
        type: "success",
        link: `https://solscan.io/tx/${txId}`,
        linkLabel: "View on Solscan",
      });
      setRecipient("");
      setAmount("");

      // Refresh balances in background after confirmation
      rpcFetch("confirmTransaction", [txId, {commitment:"confirmed"}])
        .then(()=>fetchBalances(walletPubkey))
        .catch(()=>fetchBalances(walletPubkey));

    }catch(e){
      setToast({msg:"❌ "+(e.message||"Transfer failed"), type:"error"});
      console.error("Transfer failed:", e);
    }finally{
      setSendingFee(false);
    }
  }

  async function handleBulkSendFee({rows,bulkMode,liveRate,tok}){
    if(!connected||!walletPubkey) return;
    try{
      setSendingFee(true);
      const safeRows = Array.isArray(rows)?rows:[];
      if(safeRows.length===0) throw new Error("No valid recipients.");
      const provider = getProvider();
      if(!provider) throw new Error("Wallet provider not found. Please reconnect.");
      const fromPubkey = provider.publicKey;
      const feePubkey = new window.solanaWeb3.PublicKey(FEE_WALLET);

      // Initialise all rows as pending
      const initProgress = {};
      safeRows.forEach(r=>{ initProgress[r.id]={status:"pending",txId:null,err:null}; });
      setBulkProgress(initProgress);

      let successCount=0, failCount=0;

      for(let i=0;i<safeRows.length;i++){
        const row=safeRows[i];
        try{
          const n=parseFloat(row.amount)||0;
          if(n<=0){ setBulkProgress(p=>({...p,[row.id]:{status:"failed",err:"Zero amount"}})); failCount++; continue; }
          const tokenAmount=bulkMode==="fiat"?(n/liveRate)/(tok.price||1):n;
          if(tokenAmount<=0){ setBulkProgress(p=>({...p,[row.id]:{status:"failed",err:"Amount too small"}})); failCount++; continue; }

          // Resolve recipient
          let recipientAddress=row.domain.trim();
          if(!isValidSolanaAddress(recipientAddress)){
            try{ recipientAddress=await resolveSNSDomain(recipientAddress); }
            catch(e){ throw new Error(e.message||"Could not resolve: "+row.domain); }
          }

          const toPubkey=new window.solanaWeb3.PublicKey(recipientAddress);
          const feeSol=computeFeeSolFromTokenAmount(tokenAmount,tok.price,liveSolPrice);
          let tx=new window.solanaWeb3.Transaction();

          if(tok.symbol==="SOL"){
            const lamports = lamportsToBigInt(tokenAmount);
            if(lamports <= BigInt(0)){ setBulkProgress(p=>({...p,[row.id]:{status:"failed",err:"Amount too small"}})); failCount++; continue; }
            tx.add(window.solanaWeb3.SystemProgram.transfer({fromPubkey,toPubkey,lamports}));
          } else {
            if(!tok.mint){ throw new Error(`${tok.symbol} is missing a mint address — cannot send.`); }
            const TOKEN_PROGRAM_ID=new window.solanaWeb3.PublicKey("TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA");
            const ASSOCIATED_TOKEN_PROGRAM_ID=new window.solanaWeb3.PublicKey("ATokenGPvbdGVxr1b2hvZbsiqW5xWH25efTNsLJe1bRS");
            const mintPubkey=new window.solanaWeb3.PublicKey(tok.mint);
            const knownMintMeta = KNOWN_MINTS[tok.mint];
            const decimals = (
              typeof tok.decimals==="number" ? tok.decimals :
              typeof knownMintMeta?.decimals==="number" ? knownMintMeta.decimals :
              6
            );
            const rawAmount=Math.floor(tokenAmount*Math.pow(10,decimals));
            if(rawAmount<=0){ setBulkProgress(p=>({...p,[row.id]:{status:"failed",err:"Amount too small for token precision"}})); failCount++; continue; }
            const [fromATA]=await window.solanaWeb3.PublicKey.findProgramAddress(
              [fromPubkey.toBytes(),TOKEN_PROGRAM_ID.toBytes(),mintPubkey.toBytes()],
              ASSOCIATED_TOKEN_PROGRAM_ID
            );
            const [toATA]=await window.solanaWeb3.PublicKey.findProgramAddress(
              [toPubkey.toBytes(),TOKEN_PROGRAM_ID.toBytes(),mintPubkey.toBytes()],
              ASSOCIATED_TOKEN_PROGRAM_ID
            );
            const ataInfo=await rpcFetch("getAccountInfo",[toATA.toBase58(),{encoding:"base64"}]);
            if(!ataInfo?.value){
              tx.add({
                keys:[
                  {pubkey:fromPubkey,isSigner:true,isWritable:true},
                  {pubkey:toATA,isSigner:false,isWritable:true},
                  {pubkey:toPubkey,isSigner:false,isWritable:false},
                  {pubkey:mintPubkey,isSigner:false,isWritable:false},
                  {pubkey:new window.solanaWeb3.PublicKey("11111111111111111111111111111111"),isSigner:false,isWritable:false},
                  {pubkey:TOKEN_PROGRAM_ID,isSigner:false,isWritable:false},
                  {pubkey:new window.solanaWeb3.PublicKey("SysvarRent111111111111111111111111111111111"),isSigner:false,isWritable:false},
                ],
                programId:ASSOCIATED_TOKEN_PROGRAM_ID,
                data:new Uint8Array(0)
              });
            }
            const ixData=new Uint8Array(9);
            ixData[0]=3;
            ixData.set(encodeU64LE(rawAmount),1);
            tx.add({
              keys:[
                {pubkey:fromATA,isSigner:false,isWritable:true},
                {pubkey:toATA,isSigner:false,isWritable:true},
                {pubkey:fromPubkey,isSigner:true,isWritable:false},
              ],
              programId:TOKEN_PROGRAM_ID,
              data:ixData
            });
          }

          const feeLamports=lamportsToBigInt(feeSol);
          if(feeLamports>BigInt(0)){
            tx.add(window.solanaWeb3.SystemProgram.transfer({fromPubkey,toPubkey:feePubkey,lamports:feeLamports}));
          }

          const bhResult=await rpcFetch("getLatestBlockhash",[{commitment:"confirmed"}]);
          tx.recentBlockhash=bhResult.value.blockhash;
          tx.feePayer=fromPubkey;

          const sig=await provider.signAndSendTransaction(tx);
          const txId=sig?.signature||sig;
          if(!txId) throw new Error("Not confirmed by wallet");

          setBulkProgress(p=>({...p,[row.id]:{status:"confirmed",txId,err:null}}));
          successCount++;
        }catch(e){
          failCount++;
          const errMsg = e.message||String(e);
          setBulkProgress(p=>({...p,[row.id]:{status:"failed",txId:null,err:errMsg}}));
          console.error("Bulk row failed:",row.domain,e);
        }
      }

      const msg=successCount>0
        ?`✅ Sent to ${successCount} recipient${successCount!==1?"s":""}${failCount>0?" · "+failCount+" failed":""}`
        :"❌ All transfers failed";
      setToast({msg, type:successCount>0?"success":"error"});
      await fetchBalances(walletPubkey);
    }catch(e){
      setToast({msg:"❌ Bulk send failed: "+(e.message||e), type:"error"});
      console.error("Bulk send failed:", e);
    }finally{
      setSendingFee(false);
    }
  }

  return (
    <div className="page">
      <div className="hex-bg"/>
      <nav>
        <a href={SNS_LINK} target="_blank" rel="noopener noreferrer" className="btn-register">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.5" stroke="#a3e635" strokeWidth="1.4"/><path d="M5.5 8.5c.8-.8 4.5-.8 4.5 0s-1.8 2-2.25 2" stroke="#a3e635" strokeWidth="1.3" strokeLinecap="round"/><circle cx="8" cy="5.5" r="0.7" fill="#a3e635"/></svg>
          Register .sol domain
        </a>
        {liveRates.updatedAt&&(
          <span style={{fontSize:10,color:"var(--green)",fontFamily:"var(--mono)",background:"rgba(74,222,128,0.08)",border:"1px solid rgba(74,222,128,0.2)",borderRadius:8,padding:"3px 8px",whiteSpace:"nowrap"}}>
            {ratesLoading?"⟳ updating…":`⚡ Live · ${liveRates.updatedAt}`}
          </span>
        )}
        {connected&&walletPubkey&&(
          <span className="nav-addr" title={walletPubkey}>
            {walletPubkey.slice(0,4)+"…"+walletPubkey.slice(-4)}
          </span>
        )}
        {connected
          ?<button className="btn-connected" onClick={disconnectWallet}><span className="live-dot"/>Disconnect ▾</button>
          :<button className="btn-connect" onClick={connectWallet}>Connect Wallet</button>
        }
      </nav>

      <div className="main">
        <div className="app-card">
          <div className="card-body">

            {/* ── PRE-CONNECTION GATE ── */}
            {!connected ? (
              <div style={{textAlign:"center",padding:"2.5rem 1rem"}}>
                <div style={{fontSize:48,marginBottom:16}}>🔐</div>
                <div style={{fontSize:17,fontWeight:700,color:"var(--text)",marginBottom:8}}>
                  Connect your wallet to continue
                </div>
                <div style={{fontSize:13,color:"var(--text2)",marginBottom:24,lineHeight:1.6}}>
                  Your token balances and prices will appear here after connecting.
                </div>
                <button className="send-btn" style={{maxWidth:220,margin:"0 auto"}} onClick={connectWallet}>
                  Connect Wallet
                </button>
              </div>
            ) : (
            <div>
                {/* Title + bulk toggle inline */}
                <div className="title-row">
                  <div className="card-title">{bulkMode?"Bulk Send":"Send Crypto"}</div>
                  <div className={`bulk-pill ${bulkMode?"on":""}`} onClick={()=>setBulkMode(b=>!b)}>
                    <span className="pill-txt">{bulkMode?"Bulk ON":"Bulk"}</span>
                    <div className={`tsw ${bulkMode?"on":""}`}><div className="tknob"/></div>
                  </div>
                </div>
                <p className="card-sub">{bulkMode?"Send to up to 1,000 wallets or .sol domains at once.":"Send tokens easily using .sol domains."}</p>

                {/* Send To (single mode only) */}
                {!bulkMode&&(
                  <div className="field">
                    <div className="field-label">Send To</div>
                    <div className="input-wrap">
                      <span className="sol-icon">◎</span>
                      <input value={recipient} onChange={e=>setRecipient(e.target.value)} placeholder="example.sol or wallet address"/>
                    </div>
                  </div>
                )}

                {/* Token selector */}
                <div className="field">
                  <div className="field-label">Select Token</div>
                  {walletLoading && filteredTokens.length === 0 ? (
                    <div style={{display:"flex",alignItems:"center",gap:10,padding:"12px 14px",background:"rgba(255,255,255,0.04)",border:"1.5px solid var(--border)",borderRadius:11}}>
                      <div className="spin"/>
                      <span style={{fontSize:13,color:"var(--text3)"}}>Loading your tokens…</span>
                    </div>
                  ) : walletError && filteredTokens.length === 0 ? (
                    <div style={{padding:"10px 14px",background:"rgba(248,113,113,0.08)",border:"1px solid rgba(248,113,113,0.25)",borderRadius:11,fontSize:12,color:"var(--red)"}}>
                      ⚠ Failed to load tokens — <button onClick={()=>fetchBalances(walletPubkey)} style={{background:"none",border:"none",color:"var(--lime)",cursor:"pointer",fontSize:12,fontWeight:600}}>retry</button>
                    </div>
                  ) : filteredTokens.length === 0 && !walletLoading && solBalance !== null ? (
                    <div style={{padding:"12px 14px",background:"rgba(255,255,255,0.04)",border:"1.5px solid var(--border)",borderRadius:11,fontSize:13,color:"var(--text3)",textAlign:"center"}}>
                      No tokens found in this wallet
                    </div>
                  ) : (
                    <div className="token-row" onClick={()=>setShowModal(true)}>
                      <div className="tok-left">
                        {tokLive ? (
                          <>
                            <TokenLogo token={tokLive} size={32}/>
                            <div>
                              <span className="tok-sym">{tokLive.symbol}</span>
                              <span style={{fontSize:11,color:"var(--text3)",marginLeft:6}}>
                                ${tokLive.price<0.000001?tokLive.price.toExponential(2):tokLive.price<0.0001?tokLive.price.toFixed(8):tokLive.price<1?tokLive.price.toFixed(4):tokLive.price.toLocaleString(undefined,{maximumFractionDigits:2})}
                              </span>
                            </div>
                          </>
                        ) : (
                          <span style={{fontSize:13,color:"var(--text3)"}}>Select a token</span>
                        )}
                      </div>
                      <div style={{display:"flex",alignItems:"center",gap:8}}>
                        {tokLive&&!bulkMode&&<span className="tok-equiv">≈ {dispTok} {tokLive.symbol}</span>}
                        <span className="tok-chevron">›</span>
                      </div>
                    </div>
                  )}
                </div>

                {/* Live rate info bar — only when token loaded */}
                {tokLive&&(
                  <div className="rate-badge" style={{marginBottom:"0.75rem"}}>
                    <span className="rate-dot"/>
                    1 {tokLive.symbol} = <strong>${tokLive.price<0.0001?tokLive.price.toFixed(8):tokLive.price<1?tokLive.price.toFixed(4):tokLive.price.toLocaleString(undefined,{maximumFractionDigits:2})}</strong> USD
                    <span className="rate-sep">·</span>
                    1 USD = <strong>{fmtRate(currRate)}</strong> {currency}
                    {liveRates.updatedAt&&<span style={{color:"var(--text3)",fontSize:10}}> · live</span>}
                  </div>
                )}

                {bulkMode?(
                  <BulkSendPanel
                    tok={tokLive}
                    connected={connected}
                    getLiveRate={getLiveCurrRate}
                    onSendBulkFee={handleBulkSendFee}
                    sendingFee={sendingFee}
                    bulkProgress={bulkProgress}
                  />
                ):(
                  <>
                    {/* Amount block */}
                    {tokLive&&(
                      <div className="field">
                        <div className="field-label">Amount</div>
                        <AmountInput
                          amount={amount} setAmount={setAmount}
                          inputMode={inputMode} setInputMode={setInputMode}
                          currency={currency} setCurrency={setCurrency}
                          tok={tokLive}
                          currRate={currRate}
                        />
                      </div>
                    )}

                    {/* Network fee estimate */}
                    {connected&&tokLive&&num>0&&(
                      <div style={{fontSize:11,color:"var(--text3)",marginBottom:8,display:"flex",alignItems:"center",gap:6}}>
                        <span>⛽ Est. network fee:</span>
                        <span style={{color:"var(--text2)",fontFamily:"var(--mono)"}}>
                          ~{(computeFeeSolFromTokenAmount(tokAmt,tokLive.price,liveSolPrice)+0.000005).toFixed(6)} SOL
                          {liveSolPrice>0&&(
                            <span style={{color:"var(--text3)"}}>
                              {" "}(≈ ${((computeFeeSolFromTokenAmount(tokAmt,tokLive.price,liveSolPrice)+0.000005)*liveSolPrice).toFixed(4)})
                            </span>
                          )}
                        </span>
                      </div>
                    )}

                    <button className="send-btn" disabled={
                      !connected ||
                      !tokLive ||
                      !recipient ||
                      !num ||
                      sendingFee ||
                      (tokLive.symbol==="SOL"
                        ? (solBalance!==null && tokAmt > solBalance)
                        : (tokLive.balance!=null && tokAmt > tokLive.balance))
                    } onClick={handleSingleSendFee}>
                      {!tokLive
                        ?"Select a token first"
                        :!recipient
                          ?"Enter a .sol recipient"
                          :(tokLive.symbol==="SOL" && solBalance!==null && tokAmt>solBalance)
                            ?"Insufficient SOL balance"
                            :(tokLive.balance!=null && tokAmt>tokLive.balance)
                              ?"Insufficient "+tokLive.symbol+" balance"
                              :sendingFee
                                ?"Processing..."
                                :`Send ${dispTok} ${tokLive.symbol}`
                      }
                    </button>
                  </>
                )}
              </div>
            )}
          </div>
        </div>

        <div className="info-panel">
          <div className="info-card">
            <h3>How it works</h3>
            <ul className="info-steps">
              <li className="info-step"><span className="step-num">1</span><span>Connect your Solana wallet (Phantom, Solflare, etc.)</span></li>
              <li className="info-step"><span className="step-num">2</span><span>Enter a .sol domain — SNS resolves it to a wallet address</span></li>
              <li className="info-step"><span className="step-num">3</span><span>Enter fiat or crypto amount. Live CoinGecko rate auto-converts</span></li>
              <li className="info-step"><span className="step-num">4</span><span>Confirm and send — settles on Solana instantly</span></li>
            </ul>
          </div>
          <div className="info-card">
            <h3>Fiat ↔ Crypto Input</h3>
            <p>Toggle between entering amounts in your local currency or directly in crypto. The other value updates live using CoinGecko rates.</p>
          </div>
          <div className="info-card">
            <h3>Bulk Send</h3>
            <p>Toggle Bulk Send to pay up to 1,000 wallets in one go. Upload CSV or XLSX, set amounts in fiat or crypto, and fire one transaction.</p>
          </div>
        </div>
      </div>

      <footer>
        Powered by <a href="https://x.com/solana" target="_blank" rel="noopener">Solana</a> ·
        Domains by <a href="https://x.com/sns" target="_blank" rel="noopener">SNS</a> ·
        Rates by <a href="https://x.com/coingecko?s=20" target="_blank" rel="noopener">CoinGecko</a>
      </footer>

      {showModal&&(
        <div className="modal-overlay" onClick={()=>setShowModal(false)}>
          <div className="modal-sheet" onClick={e=>e.stopPropagation()}>
            <div className="modal-head">
              <span className="modal-title">Select Token</span>
              <button className="modal-close" onClick={()=>setShowModal(false)}>✕</button>
            </div>

            {/* Loading state */}
            {walletLoading&&filteredTokens.length===0&&(
              <div style={{padding:"2rem",textAlign:"center"}}>
                <div className="spin" style={{margin:"0 auto 12px"}}/>
                <div style={{fontSize:13,color:"var(--text3)"}}>Loading your tokens…</div>
              </div>
            )}

            {/* Error state */}
            {walletError&&filteredTokens.length===0&&!walletLoading&&(
              <div style={{padding:"1.5rem",textAlign:"center"}}>
                <div style={{fontSize:36,marginBottom:12}}>⚠️</div>
                <div style={{fontSize:14,fontWeight:600,color:"var(--text)",marginBottom:6}}>
                  Failed to load tokens
                </div>
                <div style={{fontSize:12,color:"var(--text3)",marginBottom:16}}>
                  {walletError}
                </div>
                <button className="send-btn" style={{maxWidth:180,margin:"0 auto",padding:"10px 20px",fontSize:13}}
                  onClick={()=>{setShowModal(false);fetchBalances(walletPubkey);}}>
                  Retry
                </button>
              </div>
            )}

            {/* Empty state */}
            {!walletLoading&&!walletError&&filteredTokens.length===0&&(
              <div style={{padding:"2rem",textAlign:"center"}}>
                <div style={{fontSize:36,marginBottom:12}}>💰</div>
                <div style={{fontSize:14,fontWeight:600,color:"var(--text)",marginBottom:6}}>
                  No tokens found
                </div>
                <div style={{fontSize:12,color:"var(--text3)"}}>
                  This wallet doesn't hold any tokens yet.
                </div>
              </div>
            )}

            {/* Token list */}
            {filteredTokens.length>0&&(
              <>
                <input className="modal-search" autoFocus placeholder="Search by name, symbol or address…"
                  value={tokenQ} onChange={e=>setTokenQ(e.target.value)}/>
                {filteredTokens.map(t=>(
                  <div key={t.mint||t.symbol} className="modal-item"
                    onClick={()=>{setToken(t.symbol);setShowModal(false);setTokenQ("");}}>
                    <TokenLogo token={t} size={36}/>
                    <div style={{flex:1,minWidth:0}}>
                      <div className="m-name">{t.symbol}</div>
                      <div className="m-full" style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:140}}>
                        {t.name}
                      </div>
                    </div>
                    <div style={{marginLeft:"auto",textAlign:"right",minWidth:100,flexShrink:0}}>
                      {/* USD price per 1 token */}
                      {t.price>0 ? (
                        <div className="m-price" style={{fontSize:12,fontWeight:600}}>
                          ${t.price<0.000001?t.price.toExponential(2):t.price<0.0001?t.price.toFixed(8):t.price<1?t.price.toFixed(4):t.price.toLocaleString(undefined,{maximumFractionDigits:2})}
                        </div>
                      ) : (
                        <div style={{fontSize:11,color:"var(--text3)"}}>Price unavailable</div>
                      )}
                      {/* Balance: 6 significant digits */}
                      {t.balance!=null&&(
                        <div style={{fontSize:10,color:"var(--lime)",fontFamily:"var(--mono)",marginTop:2,fontWeight:600}}>
                          {fmtSig6(t.balance)} held
                        </div>
                      )}
                      {/* USD value of held balance */}
                      {t.balance!=null&&t.price>0&&(
                        <div style={{fontSize:10,color:"var(--text3)",fontFamily:"var(--mono)"}}>
                          ≈ ${(t.balance*t.price).toLocaleString(undefined,{maximumFractionDigits:2})}
                        </div>
                      )}
                    </div>
                  </div>
                ))}
              </>
            )}
          </div>
        </div>
      )}

      {/* Wallet Selection Modal */}
      {showWalletSelect&&(
        <WalletSelectModal onClose={()=>setShowWalletSelect(false)} onSelect={handleWalletSelect}/>
      )}

      {/* Toast Notification */}
      {toast&&(
        <Toast message={toast.msg} type={toast.type} link={toast.link} linkLabel={toast.linkLabel} onClose={()=>setToast(null)}/>
      )}
    </div>
  );
}

ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
